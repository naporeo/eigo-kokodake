function study(){state.view="study";state.show=false;render();}
function navHtml(){return '<div class="cardnav"><button onclick="moveCard(-1)" '+(state.pos<=0?'disabled':'')+'>‹</button><div class="center">#'+(state.pos+1)+' / '+ITEMS.length+'</div><button onclick="moveCard(1)" '+(state.pos>=ITEMS.length-1?'disabled':'')+'>›</button></div>';}
function front(x){return '<button class="navbtn" onclick="goHome()">⌂ ホーム</button><div class="box studycard">'+navHtml()+'<div class="studyhead"><span></span><span>'+(x.t==="PHRASE"?"熟語":"単語")+'</span></div><div class="word">'+esc(x.h)+'</div>'+(x.h==="record"?'':'<button class="sound" title="正式音声は後で接続">🔊</button>')+'<p class="prompt">意味を頭の中で思い出してみよう</p><button class="blue reveal" onclick="reveal()">意味を見る</button></div>';}
function back(x){return '<button class="navbtn" onclick="goHome()">⌂ ホーム</button><div class="box">'+navHtml()+'<div class="studyhead"><span></span><span>'+(x.t==="PHRASE"?"熟語":"単語")+'</span></div><div class="backword">'+esc(x.h)+'</div><div class="meaning">'+esc(x.m)+'</div><div class="visual">'+x.i+'</div><div class="anchor">💡 <b>中心イメージ</b><br>'+esc(x.a)+'</div><div class="example"><b>'+esc(x.e)+'</b><span class="sub">'+esc(x.j)+'</span></div><div class="row"><button class="review" onclick="toggle()">🔖 あとで復習</button><button class="blue" onclick="next()">次へ ›</button></div></div>';}
function moveCard(delta){var n=state.pos+delta;if(n<0||n>=ITEMS.length)return;state.pos=n;state.show=false;save();render();}
function reveal(){markSeen(ITEMS[state.pos]);state.show=true;render();}
function next(){state.pos++;state.show=false;if(state.pos>=ITEMS.length){state.pos=ITEMS.length-1;save();state.view="home";render();alert("🎉 最後まで確認しました。次は好きな位置・復習・検索から自由に学習できます。");return;}save();render();}
function toggle(){var x=ITEMS[state.pos];if(state.review[x.h])delete state.review[x.h];else state.review[x.h]=1;save();render();}
function goHome(){state.view="home";state.show=false;render();}
function reviews(){state.view="review";render();}
function reviewHtml(){var s='<button onclick="goHome()">⌂ ホーム</button><h2>復習リスト</h2>';var n=0;for(var i=0;i<ITEMS.length;i++){if(state.review[ITEMS[i].h]){s+='<div class="box"><b>'+ITEMS[i].h+'</b><br>'+ITEMS[i].m+'</div>';n++;}}if(!n)s+='<div class="box">まだ復習項目はありません。</div>';return s;}
function startChooser(){state.view="start";render();}
function startHtml(){var s='<button class="navbtn" onclick="goHome()">⌂ ホーム</button><h2>開始位置を選ぶ</h2><div class="box"><p class="sub">好きな番号から始められます。確認済み数は重複して増えません。</p><div class="startgrid">';for(var i=0;i<ITEMS.length;i+=5){s+='<button onclick="startAt('+(i+1)+')">#'+(i+1)+'</button>';}s+='</div><div class="numberrow"><input id="startNo" type="number" min="1" max="'+ITEMS.length+'" placeholder="1〜'+ITEMS.length+'"><button onclick="startNumber()">開始</button></div></div>';return s;}
function startAt(n){state.pos=Math.max(0,Math.min(ITEMS.length-1,n-1));state.view="study";state.show=false;save();render();}
function startNumber(){var e=document.getElementById("startNo");var n=parseInt(e.value,10);if(!n||n<1||n>ITEMS.length){alert("1〜"+ITEMS.length+"の番号を入力してください。");return;}startAt(n);}
function settingsView(){state.view="settings";render();}
function settingsHtml(){return '<button class="navbtn" onclick="goHome()">⌂ ホーム</button><h2>設定</h2><div class="box"><p><b>音声</b><br><span class="sub">自動再生なし（タップ再生）</span></p><p><b>学習方法</b><br><span class="sub">好きな位置から自由に学習</span></p><div class="notice">V1はシンプルさを優先。複雑なSRSやノルマは使いません。</div></div>';}
function searchView(){state.view="search";state.searchIndex=-1;render();}
function searchHtml(){return '<button onclick="goHome()">⌂ ホーム</button><h2>検索</h2><input id="q" oninput="doSearch()" placeholder="英語・日本語で検索" value="'+esc(state.searchQuery||"")+'"><div id="results"></div>';}
function doSearch(){var el=document.getElementById("q");var raw=el.value;state.searchQuery=raw;var q=raw.toLowerCase();var s="";if(q){for(var i=0;i<ITEMS.length;i++){var x=ITEMS[i];if(x.h.toLowerCase().indexOf(q)>=0||x.m.indexOf(raw)>=0||x.a.indexOf(raw)>=0){s+='<div class="box result" onclick="openSearch('+i+')"><span class="arrow">›</span><b>'+x.h+'</b><br>'+x.m+'</div>';}}}document.getElementById("results").innerHTML=s;}
function openSearch(i){state.searchIndex=i;state.view="searchDetail";render();}
function searchDetailHtml(){var x=ITEMS[state.searchIndex];if(!x){state.view="search";return searchHtml();}return '<button class="searchback" onclick="backToSearch()">← 検索結果へ戻る</button><div class="box"><div class="sub">検索から参照　'+(x.t==="PHRASE"?"熟語":"単語")+'</div><h1>'+esc(x.h)+'</h1><div class="meaning">'+esc(x.m)+'</div><div class="visual">'+x.i+'</div><div class="box" style="background:#edf8ff">💡 <b>中心イメージ</b><br>'+esc(x.a)+'</div><div class="box" style="background:#fff8e6"><b>'+esc(x.e)+'</b><br><span class="sub">'+esc(x.j)+'</span></div><div class="row"><button class="review" onclick="toggleSearchReview()">🔖 '+(state.review[x.h]?"復習に追加済み":"あとで復習")+'</button><button class="blue" onclick="backToSearch()">検索へ戻る</button></div></div>';}
function toggleSearchReview(){var x=ITEMS[state.searchIndex];if(state.review[x.h])delete state.review[x.h];else state.review[x.h]=1;save();render();}
function backToSearch(){state.view="search";render();setTimeout(function(){var q=document.getElementById("q");if(q){q.focus();doSearch();}},0);}
function render(){var a=document.getElementById("app");if(state.view==="home")a.innerHTML=home();else if(state.view==="study")a.innerHTML=state.show?back(ITEMS[state.pos]):front(ITEMS[state.pos]);else if(state.view==="review")a.innerHTML=reviewHtml();else if(state.view==="start")a.innerHTML=startHtml();else if(state.view==="settings")a.innerHTML=settingsHtml();else if(state.view==="searchDetail")a.innerHTML=searchDetailHtml();else{a.innerHTML=searchHtml();setTimeout(function(){if(state.searchQuery)doSearch();},0);}}
render();
</script></body></html>
