<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英語、ここだけ。V1 Pilot v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#173653;background:linear-gradient(#eef9ff,#fff7fb)}
#app{max-width:540px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.sub{font-size:11px;color:#6a8192}
button{border:0;font:inherit}.search{width:44px;height:44px;border-radius:14px;background:white;font-size:21px}
.hero{margin:18px 0;padding:24px 18px;border-radius:28px;background:linear-gradient(135deg,#dff5ff,#fff2bd,#ffe2ee);text-align:center}
.mascots{font-size:64px}.hero b{display:block;font-size:20px}.hero span{font-size:13px;color:#668096}
.primary{width:100%;padding:18px;border-radius:19px;background:#ffd25b;color:#173653;font-weight:900;font-size:18px}
.review{margin-top:12px;background:#ff91b7}.meta{margin:15px 3px 6px;display:flex;justify-content:space-between}.bar{height:10px;background:#dceaf3;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#65cdb7}
.card{margin-top:18px;background:white;border-radius:26px;padding:22px;min-height:72vh;box-shadow:0 12px 30px #315b7720}
.head{display:flex;justify-content:space-between;color:#698093}.word{font-size:44px;font-weight:900;text-align:center;margin:22vh 0 12px;overflow-wrap:anywhere}
.sound{display:block;margin:22px auto 8px;width:56px;height:56px;border-radius:50%;background:#e7f5ff;font-size:23px}.tag{text-align:center;font-size:12px;color:#6b8396}.reveal{display:block;margin:34px auto 0;width:82%;padding:17px;border-radius:18px;background:#278bd6;color:white;font-weight:900}
.meaning{font-size:24px;font-weight:900;margin:20px 0 12px}.visual{height:180px;border-radius:20px;background:linear-gradient(135deg,#e5f7ff,#fff0c9);display:flex;align-items:center;justify-content:center;font-size:68px}
.anchor,.example,.keys,.special{margin-top:14px;padding:14px;border-radius:15px}.anchor{background:#edf8ff}.example{background:#fff8e6}.keys{background:#f3f8fb}.keys div{margin-top:5px}.special{background:#fff0f5;border:1px solid #ffd0e0}.example b{display:block}.example small{display:block;margin-top:5px;color:#687d8c}
.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;margin-top:18px}.actions button{padding:15px;border-radius:16px;font-weight:800}.save{background:#ffe5ef;color:#a83463}.next{background:#278bd6;color:white}
.list{display:grid;gap:9px;margin-top:14px}.row{background:white;padding:14px;border-radius:15px;display:flex;justify-content:space-between}.tabs{display:flex;gap:7px;margin-top:15px}.tabs button{flex:1;padding:10px;border-radius:12px}.on{background:#dff2ff!important}.input{width:100%;padding:15px;border:1px solid #cfe0eb;border-radius:14px;margin-top:16px}
.back{background:white;border-radius:12px;padding:10px 13px}.note{text-align:center;color:#6d8392;font-size:13px;margin-top:13px}
</style></head><body><div id="app"></div>
<script>
const CONTENT={"items": [{"item_id": "i1", "headword": "shortage", "item_type": "WORD", "meaning_ja": "不足、欠乏", "memory_anchor_ja": "必要な量に足りない状態", "example": {"en": "The company is facing a shortage of staff.", "ja": "その会社は人員の不足に直面しています。"}}, {"item_id": "i2", "headword": "withdraw", "item_type": "WORD", "meaning_ja": "引き出す、取り下げる", "memory_anchor_ja": "引いて、その場所・状態から離す", "example": {"en": "I withdrew cash from the ATM.", "ja": "私はATMで現金を引き出しました。"}}, {"item_id": "i3", "headword": "account", "item_type": "WORD", "meaning_ja": "口座、アカウント", "memory_anchor_ja": "記録・出入りを管理するまとまり", "example": {"en": "I opened a new bank account.", "ja": "私は新しい銀行口座を開きました。"}}, {"item_id": "i4", "headword": "record", "item_type": "WORD", "meaning_ja": "記録／記録する", "memory_anchor_ja": "結果を残す・記録する", "example": {"en": "He set a new record.", "ja": "彼は新記録を出しました。"}}, {"item_id": "i5", "headword": "rather than", "item_type": "PHRASE", "meaning_ja": "〜ではなく、むしろ〜", "memory_anchor_ja": "BではなくAを選ぶ", "example": {"en": "We used email rather than fax.", "ja": "私たちはファックスではなくメールを使いました。"}}, {"item_id": "i6", "headword": "receipt", "item_type": "WORD", "meaning_ja": "領収書、レシート", "memory_anchor_ja": "支払いを証明する紙", "example": {"en": "Please keep your receipt.", "ja": "レシートを保管してください。"}}, {"item_id": "i7", "headword": "invoice", "item_type": "WORD", "meaning_ja": "請求書", "memory_anchor_ja": "支払いを請求する書類", "example": {"en": "We received the invoice yesterday.", "ja": "私たちは昨日、請求書を受け取りました。"}}, {"item_id": "i8", "headword": "refund", "item_type": "WORD", "meaning_ja": "返金", "memory_anchor_ja": "払ったお金が戻ること", "example": {"en": "You can get a full refund.", "ja": "全額返金を受けられます。"}}, {"item_id": "i9", "headword": "postpone", "item_type": "WORD", "meaning_ja": "延期する", "memory_anchor_ja": "予定を先の日時にずらす", "example": {"en": "The meeting was postponed.", "ja": "会議は延期されました。"}}, {"item_id": "i10", "headword": "cancel", "item_type": "WORD", "meaning_ja": "取り消す、中止する", "memory_anchor_ja": "予定そのものをなくす", "example": {"en": "They canceled the event.", "ja": "彼らはそのイベントを中止しました。"}}, {"item_id": "i11", "headword": "reschedule", "item_type": "WORD", "meaning_ja": "予定を変更する", "memory_anchor_ja": "予定を組み直す", "example": {"en": "We need to reschedule the meeting.", "ja": "会議の日程を変更する必要があります。"}}, {"item_id": "i12", "headword": "available", "item_type": "WORD", "meaning_ja": "利用できる、空いている", "memory_anchor_ja": "使える・手に入る・空いている", "example": {"en": "This service is available online.", "ja": "このサービスはオンラインで利用できます。"}}, {"item_id": "i13", "headword": "reliable", "item_type": "WORD", "meaning_ja": "信頼できる", "memory_anchor_ja": "いつも安定して信頼できる", "example": {"en": "He is a reliable employee.", "ja": "彼は信頼できる社員です。"}}, {"item_id": "i14", "headword": "eligible", "item_type": "WORD", "meaning_ja": "資格がある、適格である", "memory_anchor_ja": "条件を満たして対象になる", "example": {"en": "You are eligible for the discount.", "ja": "あなたはその割引の対象です。"}}, {"item_id": "i15", "headword": "require", "item_type": "WORD", "meaning_ja": "必要とする、要求する", "memory_anchor_ja": "ある条件・物・行動が必要", "example": {"en": "This job requires experience.", "ja": "この仕事には経験が必要です。"}}, {"item_id": "i16", "headword": "provide", "item_type": "WORD", "meaning_ja": "提供する", "memory_anchor_ja": "必要なものを与える", "example": {"en": "The hotel provides free Wi-Fi.", "ja": "そのホテルは無料Wi-Fiを提供しています。"}}, {"item_id": "i17", "headword": "recommend", "item_type": "WORD", "meaning_ja": "勧める、推薦する", "memory_anchor_ja": "よいと考えて勧める", "example": {"en": "I recommend this book.", "ja": "この本をおすすめします。"}}, {"item_id": "i18", "headword": "in response to", "item_type": "PHRASE", "meaning_ja": "〜に応じて、〜への返答として", "memory_anchor_ja": "何かを受けて反応する", "example": {"en": "We changed the plan in response to customer feedback.", "ja": "顧客の意見に応じて計画を変更しました。"}}, {"item_id": "i19", "headword": "regardless of", "item_type": "PHRASE", "meaning_ja": "〜に関係なく", "memory_anchor_ja": "条件が変わっても結果は変わらない", "example": {"en": "The event will be held regardless of the weather.", "ja": "天候に関係なくイベントは開催されます。"}}, {"item_id": "i20", "headword": "in addition to", "item_type": "PHRASE", "meaning_ja": "〜に加えて", "memory_anchor_ja": "AにプラスしてB", "example": {"en": "In addition to grammar, I study vocabulary.", "ja": "文法に加えて語彙も勉強します。"}}]};
const META={
"shortage":{v:"A",keys:["staff shortage（人手不足）","supply shortage（供給不足）"]},
"withdraw":{v:"B",keys:["withdraw money（お金を引き出す）","withdraw an application（申請を取り下げる）"]},
"account":{v:"B",keys:["bank account（銀行口座）","account for（〜を占める・説明する）"]},
"record":{v:"C",keys:["REcord（名詞：記録）","reCORD（動詞：記録する）"]},
"rather than":{v:"A",keys:["A rather than B（BではなくA）","choose A rather than B"]},
"receipt":{v:"A",keys:["keep a receipt","issue a receipt"]},"invoice":{v:"A",keys:["send an invoice","pay an invoice"]},
"refund":{v:"A",keys:["full refund","request a refund"]},"postpone":{v:"A",keys:["postpone a meeting","postpone the launch"]},
"cancel":{v:"A",keys:["cancel a reservation","cancel an order"]},"reschedule":{v:"A",keys:["reschedule a meeting","reschedule an appointment"]},
"available":{v:"A",keys:["available now","available online"]},"reliable":{v:"A",keys:["reliable source","reliable service"]},
"eligible":{v:"A",keys:["eligible for","eligible to do"]},"require":{v:"A",keys:["require approval","require experience"]},
"provide":{v:"A",keys:["provide services","provide information"]},"recommend":{v:"A",keys:["recommend doing","highly recommend"]},
"in response to":{v:"A",keys:["in response to a request","in response to feedback"]},"regardless of":{v:"A",keys:["regardless of age","regardless of the weather"]},
"in addition to":{v:"A",keys:["in addition to this","in addition to doing"]}};
const icons=["📦","🏧","🏦","🏆","↔️","🧾","📄","💴","📅","❌","🗓️","🟢","🤝","🎫","📋","🎁","👍","↩️","☔","➕"];
let s=JSON.parse(localStorage.getItem("eigo_light_state")||"null")||{order:[...Array(CONTENT.items.length).keys()].sort(()=>Math.random()-.5),pos:0,review:{},today:0};
let view="home",show=false,filter="MIXED";
if(!s.date||s.date!==new Date().toDateString()){s.date=new Date().toDateString();s.today=0}
const app=document.getElementById("app"); const save=()=>localStorage.setItem("eigo_light_state",JSON.stringify(s));
function top(back=false){return `<div class="top"><div><div class="brand">英語、ここだけ。</div><div class="sub">Small Point, Big Progress.</div></div><button class="${back?'back':'search'}" data-a="${back?'home':'search'}">${back?'⌂':'🔍'}</button></div>`}
function home(){let p=Math.round(s.pos/CONTENT.items.length*100);return `${top()}<div class="hero"><div class="mascots">🧑🏻‍🎓 👓👩🏻‍🎓</div><b>今日も、ここだけ。</b><span>少しずつ、自分のペースで。</span></div><button class="primary" data-a="study">${s.pos?'▶ 続きから学習':'▶ 学習を始める'}</button><div class="meta"><b>${s.pos} / ${CONTENT.items.length} 学習済み</b><span>今日 ${s.today}項目</span></div><div class="bar"><i style="width:${p}%"></i></div><button class="primary review" data-a="review">🔖 復習リスト ${Object.keys(s.review).length}</button>`}
function item(){if(s.pos>=CONTENT.items.length){return `${top(true)}<div class="card" style="text-align:center"><div class="word" style="margin-top:18vh">🎉</div><h2>20項目を一周しました！</h2><button class="primary" data-a="restart">もう一度ランダムに一周</button></div>`}return CONTENT.items[s.order[s.pos]]}
function front(){let x=item();if(typeof x==="string")return x;return `${top(true)}<div class="card"><div class="head"><span>${s.pos+1} / ${CONTENT.items.length}</span><span>${x.item_type==="PHRASE"?"熟語":"単語"}</span></div><div class="word">${x.headword}</div><div class="tag">${x.item_type==="PHRASE"?"熟語":"単語"}</div>${x.headword==="record"?"":'<button class="sound" data-a="sound">🔊</button>'}<div class="tag">意味を頭の中で思い出してみよう</div><button class="reveal" data-a="reveal">意味を見る</button></div>`}
function back(){let x=item(),i=s.order[s.pos],m=META[x.headword]||{v:"A",keys:[]};let special=m.v==="B"?`<div class="special">🌱 <b>意味の広がり</b><br>${m.keys[1]||""}</div>`:m.v==="C"?`<div class="special">👓 <b>読み分け</b><br>${m.keys.join("<br>")}<br><small>発音は答えを見た後に確認。</small></div>`:"";return `${top(true)}<div class="card"><div class="head"><span>${s.pos+1} / ${CONTENT.items.length}</span><span>${x.item_type==="PHRASE"?"熟語":"単語"}・${m.v}</span></div><h1>${x.headword}</h1><div class="meaning">${x.meaning_ja}</div><div class="visual">${icons[i]||"✨"}</div><div class="anchor">💡 <b>中心イメージ</b><br>${x.memory_anchor_ja||""}</div><div class="example"><b>${x.example?.en||""}</b><small>${x.example?.ja||""}</small></div><div class="keys"><b>よく使う表現</b>${m.keys.map(k=>`<div>• ${k}</div>`).join("")}</div>${special}<div class="actions"><button class="save" data-a="toggle">${s.review[x.item_id]?"✓ 復習に追加済み":"🔖 あとで復習"}</button><button class="next" data-a="next">次へ ›</button></div></div>`}
function review(){let arr=CONTENT.items.filter(x=>s.review[x.item_id]&&(filter==="MIXED"||x.item_type===filter));return `${top(true)}<h2>復習リスト</h2><div class="tabs"><button data-f="MIXED" class="${filter==="MIXED"?'on':''}">ミックス</button><button data-f="WORD" class="${filter==="WORD"?'on':''}">単語</button><button data-f="PHRASE" class="${filter==="PHRASE"?'on':''}">熟語</button></div><div class="list">${arr.length?arr.map(x=>`<div class="row"><span><b>${x.headword}</b><small>${x.meaning_ja}</small></span><button data-r="${x.item_id}">外す</button></div>`).join(""):'<div class="note">まだ復習項目はありません。</div>'}</div>`}
function search(){return `${top(true)}<h2>検索</h2><input id="q" class="input" placeholder="英語・日本語で検索"><div id="results" class="list"></div>`}
function render(){app.innerHTML=view==="home"?home():view==="study"?(show?back():front()):view==="review"?review():search();bind()}
function bind(){app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{let a=b.dataset.a;if(a==="home"){view="home";show=false}if(a==="study"){view="study";show=false}if(a==="reveal")show=true;if(a==="sound")alert("正式音声は次版で接続します");if(a==="toggle"){let x=item();s.review[x.item_id]?delete s.review[x.item_id]:s.review[x.item_id]=1;save()}if(a==="next"){s.pos++;s.today++;show=false;save();if(s.today===20)setTimeout(()=>alert("🎉 今日20項目学習しました！そのまま続けても、ここで終えてもOKです。"),20)}if(a==="review")view="review";if(a==="search")view="search";if(a==="restart"){s.order=[...Array(CONTENT.items.length).keys()].sort(()=>Math.random()-.5);s.pos=0;show=false;save()}render()});app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{delete s.review[b.dataset.r];save();render()});let q=document.getElementById("q");if(q)q.oninput=()=>{let z=q.value.trim().toLowerCase();let r=CONTENT.items.filter(x=>!z||x.headword.toLowerCase().includes(z)||x.meaning_ja.includes(q.value.trim())||x.memory_anchor_ja.includes(q.value.trim())).slice(0,30);document.getElementById("results").innerHTML=r.map(x=>`<div class="row"><span><b>${x.headword}</b><small>${x.meaning_ja}</small></span></div>`).join("")}}
render();
</script></body></html>
