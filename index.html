<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語、ここだけ。v1.0 RC2</title>
<style>
:root{--navy:#173653;--blue:#318fd5;--sky:#eaf8ff;--pink:#ff8fb7;--yellow:#ffd45d;--mint:#72d4b5;--muted:#668197;--line:#d9e9f3;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eefaff 0%,#fff8fb 68%,#fff 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--navy)}
#app{max-width:540px;margin:auto;min-height:100vh;padding:18px 18px 42px}
.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:.01em}.tagline{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.iconbtn{width:44px;height:44px;border:0;border-radius:15px;background:#fff;box-shadow:0 8px 22px rgba(53,99,126,.12);font-size:20px}
.box{background:#fff;border:1px solid rgba(207,226,238,.8);border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 10px 28px rgba(39,92,124,.08)}
.homehero{position:relative;overflow:hidden;border:0;background:linear-gradient(135deg,#dff6ff 0%,#fff1bd 52%,#ffe1ee 100%);text-align:center;padding:20px 18px 18px}
.homehero:before,.homehero:after{content:"";position:absolute;border-radius:50%;background:#fff8;filter:blur(1px)}.homehero:before{width:78px;height:78px;left:-25px;top:-18px}.homehero:after{width:55px;height:55px;right:-12px;bottom:-12px}
.chibirow{position:relative;z-index:1;display:flex;justify-content:center;gap:16px;align-items:flex-end;margin-bottom:8px}.chibi{width:116px;height:116px;border-radius:38% 38% 45% 45%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px #365d7a18;border:3px solid #fff9}.ren{background:#e4f4ff}.sera{background:#fff0f5}.face{font-size:52px;line-height:1}.name{margin-top:5px;font-size:12px;font-weight:900}.homehero h2{position:relative;z-index:1;margin:5px 0 2px;font-size:20px}.homehero p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:13px}
button{font:inherit;border:0}.main{width:100%;padding:18px;border-radius:19px;background:linear-gradient(135deg,#ffd45d,#ffc94e);color:var(--navy);font-weight:900;font-size:18px;box-shadow:0 7px 16px rgba(213,164,35,.18)}.pink{background:linear-gradient(135deg,#ff9abd,#ff82ad);margin-top:12px;box-shadow:0 7px 16px rgba(221,92,139,.15)}
.progressline{display:flex;justify-content:space-between;margin:16px 3px 7px;font-size:14px}.track{height:10px;background:#dcebf4;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#5cc8ec,#72d4b5);border-radius:99px}.homeSearch{display:flex;justify-content:center;margin-top:14px}.homeSearch button{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:14px;color:#527187}.today{text-align:center;margin-top:12px;color:var(--muted);font-size:13px}
.navbtn{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 13px;color:#4e7087}
.studycard{min-height:66vh}.studyhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.word{font-size:44px;font-weight:900;text-align:center;margin:15vh 0 16px;overflow-wrap:anywhere;line-height:1.12}.typepill{display:table;margin:0 auto;padding:5px 11px;border-radius:99px;background:#eef7fc;color:#648096;font-size:12px}.sound{display:block;margin:20px auto 10px;width:56px;height:56px;border-radius:50%;background:#e7f5ff;font-size:23px}.prompt{text-align:center;color:var(--muted);font-size:13px;margin:15px 0 24px}.blue{background:linear-gradient(135deg,#3699df,#2b82c8);color:#fff;width:100%;box-shadow:0 7px 16px rgba(49,143,213,.17)}.reveal{padding:17px;border-radius:18px;font-weight:900;font-size:17px}
.backword{font-size:31px;font-weight:900;margin:13px 0 4px}.meaning{font-size:23px;font-weight:900;margin:4px 0 14px}.visual{height:190px;border-radius:21px;background:linear-gradient(135deg,#e7f8ff,#fff1c9);display:flex;align-items:center;justify-content:center;font-size:74px;border:1px solid #e0edf4}.anchor,.example{margin-top:13px;padding:14px;border-radius:15px}.anchor{background:#edf8ff;border-left:5px solid #5bb9e9}.example{background:#fff8e6}.example b{display:block}.example .sub{display:block;margin-top:5px}.sub{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;margin-top:15px}.row button{flex:1;padding:15px;border-radius:16px;font-weight:850}.review{background:#ffe5ef;color:#a73765}
h2{margin:20px 0 8px}.tabs{display:flex;gap:7px;margin:12px 0}.tabs button{flex:1;padding:10px;border-radius:12px;background:#edf5fa;color:#58758a}.tabs .on{background:#dff2ff;color:#176fae;font-weight:850}
input{width:100%;padding:14px 15px;font-size:16px;box-sizing:border-box;border:1px solid #cfe1ec;border-radius:14px;outline:none}.result{cursor:pointer}.result:active{background:#edf8ff}.result .arrow{float:right;font-size:22px}.searchback{background:#eef5f9;border-radius:13px;padding:10px 13px;color:#4e7087}
</style></head><body>
<div id="app"><div class="box"><b>英語、ここだけ。v0.7</b><p>JavaScriptを起動しています…</p></div></div>
<script>
var ITEMS=[{"h": "shortage", "t": "WORD", "m": "不足、欠乏", "a": "必要な量に足りない状態", "e": "The company is facing a shortage of staff.", "j": "その会社は人員の不足に直面しています。", "i": "📦"}, {"h": "withdraw", "t": "WORD", "m": "引き出す、取り下げる", "a": "引いて、その場所・状態から離す", "e": "I withdrew cash from the ATM.", "j": "私はATMで現金を引き出しました。", "i": "🏧"}, {"h": "account", "t": "WORD", "m": "口座、アカウント", "a": "記録・出入りを管理するまとまり", "e": "I opened a new bank account.", "j": "私は新しい銀行口座を開きました。", "i": "🏦"}, {"h": "record", "t": "WORD", "m": "記録／記録する", "a": "結果を残す・記録する", "e": "He set a new record.", "j": "彼は新記録を出しました。", "i": "🏆"}, {"h": "rather than", "t": "PHRASE", "m": "〜ではなく、むしろ〜", "a": "BではなくAを選ぶ", "e": "We used email rather than fax.", "j": "私たちはファックスではなくメールを使いました。", "i": "↔️"}, {"h": "receipt", "t": "WORD", "m": "領収書、レシート", "a": "支払いを証明する紙", "e": "Please keep your receipt.", "j": "レシートを保管してください。", "i": "🧾"}, {"h": "invoice", "t": "WORD", "m": "請求書", "a": "支払いを請求する書類", "e": "We received the invoice yesterday.", "j": "私たちは昨日、請求書を受け取りました。", "i": "📄"}, {"h": "refund", "t": "WORD", "m": "返金", "a": "払ったお金が戻ること", "e": "You can get a full refund.", "j": "全額返金を受けられます。", "i": "💴"}, {"h": "postpone", "t": "WORD", "m": "延期する", "a": "予定を先の日時にずらす", "e": "The meeting was postponed.", "j": "会議は延期されました。", "i": "📅"}, {"h": "cancel", "t": "WORD", "m": "取り消す、中止する", "a": "予定そのものをなくす", "e": "They canceled the event.", "j": "彼らはそのイベントを中止しました。", "i": "❌"}, {"h": "reschedule", "t": "WORD", "m": "予定を変更する", "a": "予定を組み直す", "e": "We need to reschedule the meeting.", "j": "会議の日程を変更する必要があります。", "i": "🗓️"}, {"h": "available", "t": "WORD", "m": "利用できる、空いている", "a": "使える・手に入る・空いている", "e": "This service is available online.", "j": "このサービスはオンラインで利用できます。", "i": "🟢"}, {"h": "reliable", "t": "WORD", "m": "信頼できる", "a": "いつも安定して信頼できる", "e": "She is a reliable employee.", "j": "彼女は信頼できる社員です。", "i": "🤝"}, {"h": "eligible", "t": "WORD", "m": "資格がある、適格である", "a": "条件を満たしていて対象になる", "e": "You are eligible for the discount.", "j": "あなたはその割引を受ける資格があります。", "i": "🎫"}, {"h": "require", "t": "WORD", "m": "必要とする、要求する", "a": "ある条件・物・行動が必要", "e": "This job requires experience.", "j": "この仕事には経験が必要です。", "i": "📋"}, {"h": "provide", "t": "WORD", "m": "提供する", "a": "必要なものを与える", "e": "The hotel provides free Wi-Fi.", "j": "そのホテルは無料Wi-Fiを提供しています。", "i": "🎁"}, {"h": "recommend", "t": "WORD", "m": "勧める、推薦する", "a": "よいと考えて勧める", "e": "I recommend this book.", "j": "この本をおすすめします。", "i": "👍"}, {"h": "in response to", "t": "PHRASE", "m": "〜に応じて、〜への返答として", "a": "何かを受けて反応する", "e": "We changed the plan in response to customer feedback.", "j": "顧客の意見に応じて計画を変更しました。", "i": "↩️"}, {"h": "regardless of", "t": "PHRASE", "m": "〜に関係なく", "a": "条件が変わっても結果は変わらない", "e": "The event will be held regardless of the weather.", "j": "天候に関係なくイベントは開催されます。", "i": "☔"}, {"h": "in addition to", "t": "PHRASE", "m": "〜に加えて", "a": "AにプラスしてB", "e": "In addition to English, she speaks French.", "j": "英語に加えて、彼女はフランス語も話します。", "i": "➕"}];
var state={pos:0,review:{},view:"home",show:false,searchIndex:-1,searchQuery:""};
try{var old=localStorage.getItem("eigo_v10rc2");if(old)state=JSON.parse(old);}catch(e){}
function save(){try{localStorage.setItem("eigo_v10rc2",JSON.stringify(state));}catch(e){}}
function esc(s){return String(s);}
function topbar(){return '<div class="topline"><div><div class="brand">英語、ここだけ。</div><div class="tagline">Small Point, Big Progress.</div></div><button class="iconbtn" onclick="searchView()">🔍</button></div>';}
function home(){var pct=Math.round(state.pos/ITEMS.length*100);return topbar()+'<div class="box homehero"><div class="chibirow"><div class="chibi ren"><div class="face">🧑🏻</div><div class="name">レン</div></div><div class="chibi sera"><div class="face">👩🏻‍🏫</div><div class="name">セラ 👓</div></div></div><h2>今日も、ここだけ。</h2><p>少しずつ、自分のペースで。</p></div><button class="main" onclick="study()">▶ '+(state.pos?'続きから学習':'学習を始める')+'</button><div class="progressline"><b>'+state.pos+' / '+ITEMS.length+' 学習済み</b><span>'+pct+'%</span></div><div class="track"><i style="width:'+pct+'%"></i></div><button class="main pink" onclick="reviews()">🔖 復習リスト　'+Object.keys(state.review).length+'</button>';}
function study(){state.view="study";state.show=false;render();}
function front(x){return '<button class="navbtn" onclick="goHome()">⌂ ホーム</button><div class="box studycard"><div class="studyhead"><span>'+(state.pos+1)+' / '+ITEMS.length+'</span><span>'+(x.t==="PHRASE"?"熟語":"単語")+'</span></div><div class="word">'+esc(x.h)+'</div>'+(x.h==="record"?'':'<button class="sound" title="正式音声は後で接続">🔊</button>')+'<p class="prompt">意味を頭の中で思い出してみよう</p><button class="blue reveal" onclick="reveal()">意味を見る</button></div>';}
function back(x){return '<button class="navbtn" onclick="goHome()">⌂ ホーム</button><div class="box"><div class="studyhead"><span>'+(state.pos+1)+' / '+ITEMS.length+'</span><span>'+(x.t==="PHRASE"?"熟語":"単語")+'</span></div><div class="backword">'+esc(x.h)+'</div><div class="meaning">'+esc(x.m)+'</div><div class="visual">'+x.i+'</div><div class="anchor">💡 <b>中心イメージ</b><br>'+esc(x.a)+'</div><div class="example"><b>'+esc(x.e)+'</b><span class="sub">'+esc(x.j)+'</span></div><div class="row"><button class="review" onclick="toggle()">🔖 あとで復習</button><button class="blue" onclick="next()">次へ ›</button></div></div>';}
function reveal(){state.show=true;render();} function next(){state.pos++;if(state.pos>=ITEMS.length)state.pos=0;state.show=false;save();render();}
function toggle(){var x=ITEMS[state.pos];if(state.review[x.h])delete state.review[x.h];else state.review[x.h]=1;save();render();}
function goHome(){state.view="home";state.show=false;render();}
function reviews(){state.view="review";render();}
function reviewHtml(){var s='<button onclick="goHome()">⌂ ホーム</button><h2>復習リスト</h2>';var n=0;for(var i=0;i<ITEMS.length;i++){if(state.review[ITEMS[i].h]){s+='<div class="box"><b>'+ITEMS[i].h+'</b><br>'+ITEMS[i].m+'</div>';n++;}}if(!n)s+='<div class="box">まだ復習項目はありません。</div>';return s;}
function searchView(){state.view="search";state.searchIndex=-1;render();}
function searchHtml(){return '<button onclick="goHome()">⌂ ホーム</button><h2>検索</h2><input id="q" oninput="doSearch()" placeholder="英語・日本語で検索" value="'+esc(state.searchQuery||"")+'"><div id="results"></div>';}
function doSearch(){var el=document.getElementById("q");var raw=el.value;state.searchQuery=raw;var q=raw.toLowerCase();var s="";if(q){for(var i=0;i<ITEMS.length;i++){var x=ITEMS[i];if(x.h.toLowerCase().indexOf(q)>=0||x.m.indexOf(raw)>=0||x.a.indexOf(raw)>=0){s+='<div class="box result" onclick="openSearch('+i+')"><span class="arrow">›</span><b>'+x.h+'</b><br>'+x.m+'</div>';}}}document.getElementById("results").innerHTML=s;}
function openSearch(i){state.searchIndex=i;state.view="searchDetail";render();}
function searchDetailHtml(){var x=ITEMS[state.searchIndex];if(!x){state.view="search";return searchHtml();}return '<button class="searchback" onclick="backToSearch()">← 検索結果へ戻る</button><div class="box"><div class="sub">検索から参照　'+(x.t==="PHRASE"?"熟語":"単語")+'</div><h1>'+esc(x.h)+'</h1><div class="meaning">'+esc(x.m)+'</div><div class="visual">'+x.i+'</div><div class="box" style="background:#edf8ff">💡 <b>中心イメージ</b><br>'+esc(x.a)+'</div><div class="box" style="background:#fff8e6"><b>'+esc(x.e)+'</b><br><span class="sub">'+esc(x.j)+'</span></div><div class="row"><button class="review" onclick="toggleSearchReview()">🔖 '+(state.review[x.h]?"復習に追加済み":"あとで復習")+'</button><button class="blue" onclick="backToSearch()">検索へ戻る</button></div></div>';}
function toggleSearchReview(){var x=ITEMS[state.searchIndex];if(state.review[x.h])delete state.review[x.h];else state.review[x.h]=1;save();render();}
function backToSearch(){state.view="search";render();setTimeout(function(){var q=document.getElementById("q");if(q){q.focus();doSearch();}},0);}
function render(){var a=document.getElementById("app");if(state.view==="home")a.innerHTML=home();else if(state.view==="study")a.innerHTML=state.show?back(ITEMS[state.pos]):front(ITEMS[state.pos]);else if(state.view==="review")a.innerHTML=reviewHtml();else if(state.view==="searchDetail")a.innerHTML=searchDetailHtml();else{a.innerHTML=searchHtml();setTimeout(function(){if(state.searchQuery)doSearch();},0);}}
render();
</script></body></html>
