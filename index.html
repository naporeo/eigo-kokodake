<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語、ここだけ。v0.7</title>
<style>body{margin:0;background:linear-gradient(#eef9ff,#fff7fb);font-family:sans-serif;color:#173653}#app{max-width:540px;margin:auto;padding:18px}.box{background:#fff;border-radius:22px;padding:22px;margin-top:18px}button{border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:bold}.main{width:100%;background:#ffd45d}.pink{background:#ff91b7;margin-top:12px}.word{font-size:42px;font-weight:bold;text-align:center;margin:120px 0 20px}.blue{background:#2e91db;color:#fff;width:100%}.meaning{font-size:23px;font-weight:bold}.visual{font-size:70px;text-align:center;padding:28px}.sub{color:#668197;font-size:13px}.row{display:flex;gap:10px;margin-top:15px}.row button{flex:1}.review{background:#ffe5ef}input{width:100%;padding:14px;font-size:16px;box-sizing:border-box}</style></head><body>
<div id="app"><div class="box"><b>英語、ここだけ。v0.7</b><p>JavaScriptを起動しています…</p></div></div>
<script>
var ITEMS=[{"h": "shortage", "t": "WORD", "m": "不足、欠乏", "a": "必要な量に足りない状態", "e": "The company is facing a shortage of staff.", "j": "その会社は人員の不足に直面しています。", "i": "📦"}, {"h": "withdraw", "t": "WORD", "m": "引き出す、取り下げる", "a": "引いて、その場所・状態から離す", "e": "I withdrew cash from the ATM.", "j": "私はATMで現金を引き出しました。", "i": "🏧"}, {"h": "account", "t": "WORD", "m": "口座、アカウント", "a": "記録・出入りを管理するまとまり", "e": "I opened a new bank account.", "j": "私は新しい銀行口座を開きました。", "i": "🏦"}, {"h": "record", "t": "WORD", "m": "記録／記録する", "a": "結果を残す・記録する", "e": "He set a new record.", "j": "彼は新記録を出しました。", "i": "🏆"}, {"h": "rather than", "t": "PHRASE", "m": "〜ではなく、むしろ〜", "a": "BではなくAを選ぶ", "e": "We used email rather than fax.", "j": "私たちはファックスではなくメールを使いました。", "i": "↔️"}, {"h": "receipt", "t": "WORD", "m": "領収書、レシート", "a": "支払いを証明する紙", "e": "Please keep your receipt.", "j": "レシートを保管してください。", "i": "🧾"}, {"h": "invoice", "t": "WORD", "m": "請求書", "a": "支払いを請求する書類", "e": "We received the invoice yesterday.", "j": "私たちは昨日、請求書を受け取りました。", "i": "📄"}, {"h": "refund", "t": "WORD", "m": "返金", "a": "払ったお金が戻ること", "e": "You can get a full refund.", "j": "全額返金を受けられます。", "i": "💴"}, {"h": "postpone", "t": "WORD", "m": "延期する", "a": "予定を先の日時にずらす", "e": "The meeting was postponed.", "j": "会議は延期されました。", "i": "📅"}, {"h": "cancel", "t": "WORD", "m": "取り消す、中止する", "a": "予定そのものをなくす", "e": "They canceled the event.", "j": "彼らはそのイベントを中止しました。", "i": "❌"}, {"h": "reschedule", "t": "WORD", "m": "予定を変更する", "a": "予定を組み直す", "e": "We need to reschedule the meeting.", "j": "会議の日程を変更する必要があります。", "i": "🗓️"}, {"h": "available", "t": "WORD", "m": "利用できる、空いている", "a": "使える・手に入る・空いている", "e": "This service is available online.", "j": "このサービスはオンラインで利用できます。", "i": "🟢"}, {"h": "reliable", "t": "WORD", "m": "信頼できる", "a": "いつも安定して信頼できる", "e": "She is a reliable employee.", "j": "彼女は信頼できる社員です。", "i": "🤝"}, {"h": "eligible", "t": "WORD", "m": "資格がある、適格である", "a": "条件を満たしていて対象になる", "e": "You are eligible for the discount.", "j": "あなたはその割引を受ける資格があります。", "i": "🎫"}, {"h": "require", "t": "WORD", "m": "必要とする、要求する", "a": "ある条件・物・行動が必要", "e": "This job requires experience.", "j": "この仕事には経験が必要です。", "i": "📋"}, {"h": "provide", "t": "WORD", "m": "提供する", "a": "必要なものを与える", "e": "The hotel provides free Wi-Fi.", "j": "そのホテルは無料Wi-Fiを提供しています。", "i": "🎁"}, {"h": "recommend", "t": "WORD", "m": "勧める、推薦する", "a": "よいと考えて勧める", "e": "I recommend this book.", "j": "この本をおすすめします。", "i": "👍"}, {"h": "in response to", "t": "PHRASE", "m": "〜に応じて、〜への返答として", "a": "何かを受けて反応する", "e": "We changed the plan in response to customer feedback.", "j": "顧客の意見に応じて計画を変更しました。", "i": "↩️"}, {"h": "regardless of", "t": "PHRASE", "m": "〜に関係なく", "a": "条件が変わっても結果は変わらない", "e": "The event will be held regardless of the weather.", "j": "天候に関係なくイベントは開催されます。", "i": "☔"}, {"h": "in addition to", "t": "PHRASE", "m": "〜に加えて", "a": "AにプラスしてB", "e": "In addition to English, she speaks French.", "j": "英語に加えて、彼女はフランス語も話します。", "i": "➕"}];
var state={pos:0,review:{},view:"home",show:false};
try{var old=localStorage.getItem("eigo_v07");if(old)state=JSON.parse(old);}catch(e){}
function save(){try{localStorage.setItem("eigo_v07",JSON.stringify(state));}catch(e){}}
function esc(s){return String(s);}
function home(){return '<h2>英語、ここだけ。</h2><div class="sub">Small Point, Big Progress.</div><div class="box" style="text-align:center;font-size:55px">🧑🏻‍🎓 👓👩🏻‍🎓<h3 style="font-size:20px">今日も、ここだけ。</h3></div><button class="main" onclick="study()">▶ '+(state.pos?'続きから学習':'学習を始める')+'</button><p><b>'+state.pos+' / '+ITEMS.length+' 学習済み</b></p><button class="main pink" onclick="reviews()">🔖 復習リスト '+Object.keys(state.review).length+'</button><p><button onclick="searchView()">🔍 検索</button></p>';}
function study(){state.view="study";state.show=false;render();}
function front(x){return '<button onclick="goHome()">⌂ ホーム</button><div class="box"><div class="sub">'+(state.pos+1)+' / '+ITEMS.length+'　'+(x.t==="PHRASE"?"熟語":"単語")+'</div><div class="word">'+esc(x.h)+'</div>'+(x.h==="record"?'':'<div style="text-align:center;font-size:30px">🔊</div>')+'<p class="sub" style="text-align:center">意味を頭の中で思い出してみよう</p><button class="blue" onclick="reveal()">意味を見る</button></div>';}
function back(x){return '<button onclick="goHome()">⌂ ホーム</button><div class="box"><h1>'+esc(x.h)+'</h1><div class="meaning">'+esc(x.m)+'</div><div class="visual">'+x.i+'</div><div class="box" style="background:#edf8ff">💡 <b>中心イメージ</b><br>'+esc(x.a)+'</div><div class="box" style="background:#fff8e6"><b>'+esc(x.e)+'</b><br><span class="sub">'+esc(x.j)+'</span></div><div class="row"><button class="review" onclick="toggle()">🔖 あとで復習</button><button class="blue" onclick="next()">次へ ›</button></div></div>';}
function reveal(){state.show=true;render();} function next(){state.pos++;if(state.pos>=ITEMS.length)state.pos=0;state.show=false;save();render();}
function toggle(){var x=ITEMS[state.pos];if(state.review[x.h])delete state.review[x.h];else state.review[x.h]=1;save();render();}
function goHome(){state.view="home";state.show=false;render();}
function reviews(){state.view="review";render();}
function reviewHtml(){var s='<button onclick="goHome()">⌂ ホーム</button><h2>復習リスト</h2>';var n=0;for(var i=0;i<ITEMS.length;i++){if(state.review[ITEMS[i].h]){s+='<div class="box"><b>'+ITEMS[i].h+'</b><br>'+ITEMS[i].m+'</div>';n++;}}if(!n)s+='<div class="box">まだ復習項目はありません。</div>';return s;}
function searchView(){state.view="search";render();} function searchHtml(){return '<button onclick="goHome()">⌂ ホーム</button><h2>検索</h2><input id="q" oninput="doSearch()" placeholder="英語・日本語で検索"><div id="results"></div>';}
function doSearch(){var q=document.getElementById("q").value.toLowerCase();var s="";for(var i=0;i<ITEMS.length;i++){var x=ITEMS[i];if(x.h.toLowerCase().indexOf(q)>=0||x.m.indexOf(q)>=0) s+='<div class="box"><b>'+x.h+'</b><br>'+x.m+'</div>';}document.getElementById("results").innerHTML=s;}
function render(){var a=document.getElementById("app");if(state.view==="home")a.innerHTML=home();else if(state.view==="study")a.innerHTML=state.show?back(ITEMS[state.pos]):front(ITEMS[state.pos]);else if(state.view==="review")a.innerHTML=reviewHtml();else a.innerHTML=searchHtml();}
render();
</script></body></html>
